<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Surat Suara - Pilkades Ridogalih 2026</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="voting-page">
<header class="header">
<img class="logo" src="img/logo-bekasi.png" alt="Logo Kabupaten Bekasi">
<h1>SURAT SUARA</h1>
<h2>PEMILIHAN KEPALA DESA RIDOGALIH</h2>
<h2>KECAMATAN CIBARUSAH KABUPATEN BEKASI</h2>
<h2>MASA BAKTI 2026–2034</h2>
</header>
<section class="candidate-grid">
<article class="candidate-card" data-number="1" data-name="CAHYA NISKALA"><div class="photo-wrap"><span class="number">1</span><img src="img/calon1.jpg" alt="Calon 1"></div><div class="candidate-name">CAHYA NISKALA</div></article>
<article class="candidate-card" data-number="2" data-name="ADIWANGSA"><div class="photo-wrap"><span class="number">2</span><img src="img/calon2.jpg" alt="Calon 2"></div><div class="candidate-name">ADIWANGSA</div></article>
<article class="candidate-card" data-number="3" data-name="NENENG SARTIKA"><div class="photo-wrap"><span class="number">3</span><img src="img/calon3.jpg" alt="Calon 3"></div><div class="candidate-name">NENENG SARTIKA</div></article>
<article class="candidate-card" data-number="4" data-name="MAMAN SUPRATMAN"><div class="photo-wrap"><span class="number">4</span><img src="img/calon4.jpg" alt="Calon 4"></div><div class="candidate-name">MAMAN SUPRATMAN</div></article>
<article class="candidate-card" data-number="5" data-name="MARKONAH"><div class="photo-wrap"><span class="number">5</span><img src="img/calon5.jpg" alt="Calon 5"></div><div class="candidate-name">MARKONAH</div></article>
</section>
<button id="voteButton" class="vote-button">Pilih Kandidat Ini</button>
</main>

<div id="confirmOverlay" class="overlay hidden">
<div class="confirm-modal">
<div class="confirm-title">Konfirmasi Pemilihan</div>
<div class="confirm-question">Apa Anda yakin akan memilih kandidat ini?</div>
<div class="selected-candidate"><img id="selectedImage" src="" alt=""><div id="selectedName" class="selected-name"></div></div>
<div class="modal-actions">
<button id="cancelButton" class="repeat-button">Ulangi</button>
<button id="confirmButton" class="confirm-button">Pilih</button>
</div>
</div>
</div>

<div id="successOverlay" class="overlay hidden">
<div class="success-modal">
<div class="check-circle">✓</div>
<div class="success-title">Terima Kasih</div>
<div class="success-text">Suara berhasil dikirim dan tersimpan.</div>
</div>
</div>

<script src="script.js"></script>
</body>
</html>
